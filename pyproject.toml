[project]
name = "sars-data"
version = "0.1.0"
requires-python = ">=3.14.10"
dependencies = [
    "boto3>=1.35.0",
    "earthengine-api>=1.0.0",
    "fastapi>=0.115.0",
    "fsspec>=2024.6.0",
    "geopandas>=1.0.0",
    "h5netcdf>=1.3.0",
    "httpx>=0.27.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyproj>=3.6.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "python-dotenv>=1.0.1",
    "rasterio>=1.3.10",
    "s3fs>=2024.6.0",
    "shapely>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "xarray>=2024.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_default_fixture_loop_scope = "function"
